<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Girlfriend's Day!</title>
    <style>
        /* Importing the love letter font */
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

        body {
            background-color: #ffe6ea; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden; 
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none; 
            position: relative; /* Added to keep containers perfectly stacked */
        }

        /* Both containers are stacked perfectly on top of each other */
        .content-container {
            padding: 20px;
            max-width: 400px;
            z-index: 10;
            position: absolute; 
            width: 100%;
            /* This controls the speed and feel of the animation */
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
        }

        /* --- LOCK SCREEN ANIMATION STATES --- */
        #lock-screen {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* When unlocked, the lock screen fades out and zooms toward the camera */
        body.unlocked #lock-screen {
            opacity: 0;
            transform: scale(1.15); 
            pointer-events: none;
        }

        /* --- MAIN CONTENT ANIMATION STATES --- */
        #main-content {
            opacity: 0;
            transform: scale(0.9); /* Starts slightly zoomed out in the background */
            pointer-events: none; 
        }

        /* When unlocked, the main content fades in and scales to normal size */
        body.unlocked #main-content {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }


        /* Text & Button Styling */
        h1 {
            color: #d6336c; 
            margin-bottom: 10px;
        }

        #lock-screen h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 64px; 
            margin-top: 0;
            margin-bottom: 5px;
        }

        .hint-text {
            font-family: 'Dancing Script', cursive;
            font-size: 32px; 
            color: #d6336c;
            margin-top: 0;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            font-size: 18px;
            line-height: 1.5;
        }

        input[type="password"] {
            border: none;
            border-bottom: 3px solid #ffb3c1;
            background: transparent;
            font-size: 36px;
            letter-spacing: 8px;
            width: 140px;
            margin: 10px auto 25px auto;
            text-align: center;
            outline: none;
            color: #d6336c;
            height: 45px;
            display: block;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .key {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.6);
            border: 2px solid #ffb3c1;
            font-size: 28px;
            color: #d6336c;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .key:hover, .key:active {
            background-color: #d6336c;
            color: white;
            border-color: #d6336c;
            transform: scale(0.95);
        }

        .empty-key {
            width: 70px;
            height: 70px;
        }

        #error-message {
            display: none;
            color: #ff4d4d;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
        }

        #secret-message {
            display: none;
            margin-top: 20px;
            font-weight: bold;
            color: #ff4d4d;
        }

        .unlock-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .unlock-btn:hover {
            background-color: #ff3333;
        }

        .heart {
            position: absolute;
            color: #ff4d4d;
            font-size: 24px;
            animation: float linear infinite;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- LOCK SCREEN SECTION -->
    <div class="content-container" id="lock-screen">
        <h1>Heyy beautiful</h1>
        <p class="hint-text">our anniversary date (ddmm)</p>
        
        <input type="password" id="passcode-input" readonly>
        
        <div class="keypad">
            <div class="key" onclick="pressKey('1')">1</div>
            <div class="key" onclick="pressKey('2')">2</div>
            <div class="key" onclick="pressKey('3')">3</div>
            <div class="key" onclick="pressKey('4')">4</div>
            <div class="key" onclick="pressKey('5')">5</div>
            <div class="key" onclick="pressKey('6')">6</div>
            <div class="key" onclick="pressKey('7')">7</div>
            <div class="key" onclick="pressKey('8')">8</div>
            <div class="key" onclick="pressKey('9')">9</div>
            <div class="key" style="font-size: 22px;" onclick="clearPin()">C</div>
            <div class="key" onclick="pressKey('0')">0</div>
            <div class="empty-key"></div>
        </div>

        <button class="unlock-btn" onclick="checkPasscode()">Unlock</button>
        
        <p id="error-message">Oops! That's not it. Try again! 🔒</p>
    </div>


    <!-- MAIN CONTENT SECTION -->
    <div class="content-container" id="main-content">
        <h1>Happy Girlfriend's Day! ❤️</h1>
        <p>To the most amazing person in the world...</p>
        
        <button class="unlock-btn" onclick="revealMessage()">I have something to tell you</button>
        
        <p id="secret-message">I love you more than words can say! Thank you for making every single day so incredibly special.</p>
    </div>

    <!-- JavaScript -->
    <script>
        // --- CUSTOMIZE YOUR PASSCODE HERE ---
        const correctPasscode = "0101"; 

        let currentPin = "";
        let heartInterval; 

        function pressKey(num) {
            if (currentPin.length < 4) {
                currentPin += num;
                document.getElementById('passcode-input').value = currentPin;
                document.getElementById('error-message').style.display = 'none';
            }
        }

        function clearPin() {
            currentPin = "";
            document.getElementById('passcode-input').value = currentPin;
            document.getElementById('error-message').style.display = 'none';
        }

        function checkPasscode() {
            const errorMessage = document.getElementById('error-message');
            
            if (currentPin === correctPasscode) {
                // This single line triggers the smooth CSS animation
                document.body.classList.add('unlocked');
                errorMessage.style.display = 'none';
                
                // Wait for the fade animation to finish (800ms) before starting the hearts
                setTimeout(() => {
                    heartInterval = setInterval(createHeart, 300);
                }, 800);
                
            } else {
                errorMessage.style.display = 'block';
                clearPin(); 
            }
        }

        function revealMessage() {
            document.getElementById('secret-message').style.display = 'block';
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's'; 
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
    </script>

</body>
</html>
